[project]
name = "dyrel"
version = "0.1.0"
description = "Dynamic relational engine embedded in Python"
readme = "README.md"
authors = [
    { name = "Serhii Mozghovyi", email = "egnartsms@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
]

[project.scripts]
dy-load = "dyrel.load:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib"
]


[tool.ruff]
line-length = 90
indent-width = 4
target-version = "py311"
format.quote-style = "double"

[tool.ruff.lint]
isort.combine-as-imports = true
isort.force-single-line = true
ignore = [
    "BLE001",  # catch Exception:
    "S102",  # Use of 'exec' detected
]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    # "script/",  not used at this point, uncomment if start using
]
