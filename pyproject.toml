[project]
name = "dyrel"
version = "0.1.0"
description = "Dynamic relational engine embedded in Python"
readme = "README.md"
authors = [
    { name = "Serhii Mozghovyi", email = "egnartsms@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typing-extensions",
]

[project.scripts]
run = "dyrel.host.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipython",
    "pytest",
    "ruff",
    "ty",
]

[tool.pytest]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib"
]


[tool.ruff]
line-length = 90
indent-width = 4
target-version = "py311"
format.quote-style = "double"

[tool.ruff.lint]
isort.combine-as-imports = true
# isort.force-single-line = true
flake8-type-checking.strict = true
future-annotations = true
extend-select = [
    "PLE0237",
    "TC",
]
ignore = [
    "BLE001",  # catch Exception:
    "S102",    # Use of 'exec' detected
    "RUF023",  # __slots__ is not sorted
    "TC003",   # Move standard library import {} into a type-checking block
]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    # "script/",  not used at this point, uncomment if start using
]
